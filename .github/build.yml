name: Flutter Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java Environment (kwa ajili ya Android build)
      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Setup Flutter Environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Check code formatting & static analysis (hiari)
      - name: Analyze Project
        run: flutter analyze

      # 6. Run Unit/Widget Tests
      - name: Run Tests
        run: flutter test

      # 7. Build Android APK
      - name: Build Android APK
        run: flutter build apk --release

      # 8. Upload the APK as an artifact (ili uweze kuidownload GitHub)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk